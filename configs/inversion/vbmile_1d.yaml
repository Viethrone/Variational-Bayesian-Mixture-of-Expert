# Main 1-D recipe: Geo-VB-MILE (dim=1), the configuration behind the reported numbers.
#
# Full-covariance variational posterior (`variational_covariance: full`) plus the
# closed-form (analytic-expectation) well likelihood (`well_nll_mode: expert`) and a
# tempered KL with a single temperature c = 0.01 (both KL weights must be equal).
#
# Why this combination:
#   * full covariance is required: switching from diagonal costs no accuracy (every
#     delta is inside the noise floor);
#   * a strict ELBO (c = 1) pulls theta hard toward N(0, I) under the unit prior and
#     measurably hurts the score, so the objective is tempered; c = 0.01 matches the
#     diagonal anchor;
#   * the analytic well likelihood is the only form that exposes tr(Sigma_k) to the
#     full-covariance posterior;
#   * the seismic term keeps a weak weight of 0.03 (w in [0, 0.3] is a plateau; the old
#     default of 1.0 was the worst arm of the sweep).
#
# Section R^2 (test set, 1360 traces, seed 0): Vp 0.9766 / Vs 0.9761 / Den 0.9508.
_base_:
  - ../base.yaml
  - ../data/seismic1d.yaml
  - ../model/vbmile_1d.yaml

exp_name: vbmile_1d

# Reproducibility: the loader side (num_workers 0 + explicit generator) is set in
# configs/data/seismic1d.yaml and same-seed reruns reproduce the trajectory.
# The *strict* protocol (`deterministic_algorithms: true`) is deliberately NOT enabled here:
# the decoder downsamples the gate weights with `F.interpolate(mode="linear")`, whose CUDA
# backward has no deterministic kernel, so strict mode raises at the first backward pass.
# The 2-D recipe can enable it because its upsampling is bilinear. Use
# `deterministic_algorithms: warn` if you want the check without the hard failure.

model:
  variational_covariance: full     # required: q(theta|z=k) = N(mu_k, Sigma_k)

forward:
  _target_: synthetic_seismic      # differentiable forward (truth -> synthetic gathers)
  dim: 1
  angles_deg: [5, 10, 15, 20, 25, 30]
  wavelet:                         # Ricker wavelet settings (generated on demand)
    dt: 0.002
    f: 20.0
    length: 0.1

loss:
  _target_: vbelbo_1d
  seismic_obs_noise_init: 5.0
  well_obs_noise_init: 1.0
  clip_diff: 10.0
  well_nll_mode: expert            # analytic E_q[-log p(y|theta)], no sampling
  # Single temperature: both KL weights must be equal, otherwise the objective is not
# writable as c * KL(q || p) and falls back to the legacy weighted form.
  kl_z_weight: 0.01
  kl_theta_weight: 0.01
  expert_lambdas: null             # per-expert lambda excludes the single temperature
  seismic_weight: 0.03             # weak seismic weight (the real knob is w / sigma_seis^2)

trainer:
  _target_: vbmile
  max_epochs: 500
  lr: 1.0e-3
  weight_decay: 1.0e-2
  warmup_epochs: 50
  warmup_start_lr: 1.0e-6
  lr_min: 1.0e-4
  grad_clip: 1.0
  batch_size: 20
  shuffle_train: true

# A non-full variational family fails the mandatory contract check (strict refuses)
theory_contract:
  require_full: true

metrics:
  - rmse
  - r2
  - pearson
  - mae
  - ssim