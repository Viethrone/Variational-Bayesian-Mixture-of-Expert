_base_: ../base.yaml

exp_name: seismic_1d_marmousi2

data:
  _target_: seismic_1d                        # src/data/seismic_dataset.py::Seismic1DDataset
  name: marmousi2_1d
  root: data/processed/marmousi2_1d           # one processed namespace per dataset (own MANIFEST)
  splits_dir: data/splits

  # Rebuilt artefacts under data/processed (physical space; z-scored at load time)
  files:
    seismic: seismic6.npy            # (6, 1200, 1360) observed gathers, 0 deg dropped
    target: target.npy               # (3, 1200, 1360) ground-truth Vp / Vs / density
    target_low: target_low_s30.npy   # (3, 1200, 1360) low-frequency model, sigma=30
    spatial_prior: spatial_prior.npy # (K, 1200, 1360) spatial prior, channel-first
    gmm_prior: gmm_prior.npz         # (K,3) parameter prior in normalized space

  target_columns: [Vp, Vs, Den]

  splits:
    train: data/splits/marmousi2_1d/train.txt
    val: data/splits/marmousi2_1d/val.txt
    test: data/splits/marmousi2_1d/test.txt

  shape:
    observation: [6, 1200]
    target: [3, 1200]

  normalization:
    method: standard                 # z-score in the dataset, statistics from stats_file
    stats_file: data/interim/norm_stats.json

  loader:
    batch_size: 20
    shuffle_train: true
    drop_last: false
    # Deterministic protocol, as in the 2-D config: workers off, and the shuffle order
    # plus the worker seeds taken from an explicit generator, so scheduling cannot move
    # the run. Pair with the top-level `deterministic` / `deterministic_algorithms` keys
    # in the recipe config for a bit-wise reproducible rerun.
    num_workers: 0
    explicit_generator: true
    pin_memory: false

# ---- used by run_preprocess only (build_dataset ignores it) ----
preprocess:
  root: data/processed/marmousi2_1d
  interim_dir: data/interim
  splits_dir: data/splits
  raw:
    observations: data/raw/observations
    priors: data/raw/priors
  low_sigma: 30                      # gaussian_filter(target, sigma=30, axes=(1, 2))
  num_train: 12
  num_val: 7
  train_start: 20
  train_end: 1300
  val_start: 30
  val_end: 1300
  dtype: float32