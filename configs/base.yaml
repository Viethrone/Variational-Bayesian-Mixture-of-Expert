# Shared defaults inherited by every concrete config.
# Paths are relative to the project root; per-experiment values do not belong here.

exp_name: default          # overridden by --name
seed: 0
device: auto               # auto | cpu | cuda | mps
num_workers: 4
precision: 32              # 16 | 32 | bf16

paths:
  project_root: .
  data_raw: data/raw
  data_interim: data/interim
  data_processed: data/processed
  data_external: data/external
  data_splits: data/splits
  outputs: outputs
  runs: outputs/runs
  figures: figures

logging:
  level: INFO              # DEBUG | INFO | WARNING | ERROR
  log_file: logs/run.log   # relative to the run directory
  console: true
  # tensorboard / wandb can be enabled when needed
  tensorboard: false
  wandb: false
  wandb_project: null

checkpoint:
  save_dir: checkpoints    # relative to the run directory
  save_last: true
  save_best: true
  metric_for_best: null    # e.g. rmse / r2
  mode: min                # min | max

# The sections below are filled in by configs/data, configs/model, configs/inversion
data: {}
model: {}
forward: {}
inversion: {}
prior: {}
regularizer: {}
loss: {}
# Per-angle reliability masking of the seismic likelihood (opt-in, off by default; see
# src/forward/reliability.py). Omitting these keys means mode: none, which keeps the
# numerics and the loss_dict key set identical to the released path. Enable it per arm:
#   seismic_mask_mode: critical_angle    # none | critical_angle
#   seismic_mask_layer_sigma: 0.0        # depth smoothing of Vp, in samples; 0 = adjacent
#   seismic_mask_taper_deg: 5.0          # cosine taper width below theta_c, degrees
#   seismic_mask_floor: 0.0              # weight kept beyond theta_c
# On the 5-30 deg Marmousi2 data this is a no-op: every interface has theta_c >= 32.8 deg,
# so a hard mask removes nothing and only the taper edge touches <= 0.04% of the pixels.
# When enabled, loss_dict also reports seismic_mask_occupancy (= 1 - mean(w)) and
# seismic_mask_occupancy_energy (residual energy covered by zero weights).
metrics: {}
trainer: {}

# Theory contract (written to <run>/theory_contract.json on every run).
#   * require_full: true  - "the variational family must be full covariance" becomes a
#     mandatory check (the delivery recipes set it); diagonal-only reproductions and
#     ablations keep it false so they are not reported as failures.
#   * strict: true        - fail hard when a mandatory check does not pass; the default
#     only warns and records.
# Weighted KL, learned noise and a non-strict ELBO are allowed conventions: recorded, not
# enforced.
theory_contract:
  strict: false
  require_full: false
