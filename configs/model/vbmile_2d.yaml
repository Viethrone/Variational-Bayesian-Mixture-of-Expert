# 2-D model: GeoVBMILE(dim=2) with fully independent experts and spatial FiLM.
# The structure is fixed in src/models/vbmile/_film_decoder2d.py::ExpertDecoder2D
# (merged output head, skip2 convolved before upsampling, same-size tail, deterministic
# reflect padding); this file only sets the skeleton and the FiLM parameters. Encoder
# geometry, per-expert receptive field and the likelihood live in the delivery recipe
# configs/inversion/vbmile_2d.yaml.
_base_:
  - ../base.yaml
  - base_vbmile.yaml

exp_name: vbmile_2d_model

model:
  _target_: vbmile_2d
  dim: 2
  base_channels: 16
  final_temperature: 0.1
  film_hidden_dim: 8
  film_kernel_size: 3
  modulation_scale: 1.0
  prior_means: null
  prior_vars: null