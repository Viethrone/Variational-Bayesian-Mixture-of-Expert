_base_: ../base.yaml

exp_name: seismic_2d_marmousi2

data:
  _target_: seismic_2d                        # src/data/seismic_dataset.py::Seismic2DDataset
  name: marmousi2_2d
  root: data/processed/marmousi2_2d           # one processed namespace per dataset (own MANIFEST)
  splits_dir: data/splits

  files:
    seismic: seismic6.npy            # (6, 1200, 1360)
    target: target.npy               # (3, 1200, 1360)
    target_low: target_low_s100.npy  # (3, 1200, 1360) low-frequency model, sigma=100
    spatial_prior: spatial_prior.npy # (K, 1200, 1360)
    gmm_prior: gmm_prior.npz         # (K, 3)

  target_columns: [Vp, Vs, Den]

  # 2-D windowing: slice = fixed-width window around each well (training default);
  # full = the whole section as one sample (used for a single forward pass).
  # Override at run time: --set data.window.mode=full
  window:
    mode: slice
    radius: 7                        # half-width; the window is 2*radius+1 traces
    pad: reflect

  splits:
    train: data/splits/marmousi2_2d/train.txt
    val: data/splits/marmousi2_2d/val.txt
    test: data/splits/marmousi2_2d/test.txt

  shape:
    observation: [6, 1200, 15]
    target: [3, 1200, 15]

  normalization:
    method: standard
    stats_file: data/interim/norm_stats.json

  loader:
    batch_size: 30
    shuffle_train: true
    drop_last: false
    # Deterministic protocol: num_workers is fixed at 0 and the shuffle order plus the
    # worker seeds come from an explicit generator, so scheduling cannot move the run
    num_workers: 0
    explicit_generator: true
    pin_memory: false

# ---- used by run_preprocess only ----
preprocess:
  root: data/processed/marmousi2_2d
  interim_dir: data/interim
  splits_dir: data/splits
  raw:
    observations: data/raw/observations
    priors: data/raw/priors
  low_sigma: 100                     # sigma used for the 2-D model
  num_train: 12
  num_val: 3
  train_start: 20
  train_end: 1300
  val_start: 30
  val_end: 1300
  dtype: float32