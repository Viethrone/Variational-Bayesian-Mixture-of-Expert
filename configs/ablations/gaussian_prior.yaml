# Ablation: gaussian_prior - a single Gaussian parameter prior built from the global
# z-score statistics of the training targets instead of the 3-mode GMM. run_main
# injects the same (K,3) mean/variance for every expert (K = num_experts). Because the
# targets are z-scored this prior is close to N(0, I), contrasting the discrete modes.
_base_: ../inversion/vbmile_1d.yaml

exp_name: ablation_gaussian_prior

prior:
  _target_: gaussian