_base_: ../base.yaml

exp_name: seismic_2d_marmousi2

data:
  _target_: seismic_2d                        # src/data/seismic_dataset.py::Seismic2DDataset
  name: marmousi2_2d
  root: data/processed/marmousi2_2d           # 每个数据集独立 processed 命名空间（MANIFEST 不互相覆盖）
  splits_dir: data/splits

  files:
    seismic: seismic6.npy            # (6, 1200, 1360)
    target: target.npy               # (3, 1200, 1360)
    target_low: target_low_s100.npy  # (3, 1200, 1360) 2D 口径 sigma=100
    spatial_prior: spatial_prior.npy # (K, 1200, 1360)
    gmm_prior: gmm_prior.npz         # (K, 3)

  target_columns: [Vp, Vs, Den]

  # 2D 窗口抽取：slice = 以井位为中心的定宽切片（训练默认）；full = 整个剖面为单样本
  # （整剖面一次前向的推理/评测口径，meta.mask 在划分井位列=1；test 划分含全部道→全一 mask）。
  # 运行期覆盖示例：--set data.window.mode=full
  window:
    mode: slice
    radius: 7                        # 窗口半宽，总宽 2*radius+1
    pad: reflect

  splits:
    train: data/splits/marmousi2_2d/train.txt
    val: data/splits/marmousi2_2d/val.txt
    test: data/splits/marmousi2_2d/test.txt

  shape:
    observation: [6, 1200, 15]
    target: [3, 1200, 15]

  normalization:
    method: standard
    stats_file: data/interim/norm_stats.json

  loader:
    batch_size: 30
    shuffle_train: true
    drop_last: false
    # 确定性协议：`num_workers` 固定 0；训练 loader 的 shuffle 顺序与 worker seed
    # 都从显式 generator 取 ⇒ 复现不依赖进程/线程调度
    num_workers: 0
    explicit_generator: true
    pin_memory: false

# ---- run_preprocess 专用区块 ----
preprocess:
  root: data/processed/marmousi2_2d
  interim_dir: data/interim
  splits_dir: data/splits
  raw:
    observations: data/raw/observations
    priors: data/raw/priors
  low_sigma: 100                     # 2D 口径 sigma=100
  num_train: 12
  num_val: 3
  train_start: 20
  train_end: 1300
  val_start: 30
  val_end: 1300
  dtype: float32