# Shared model config for the main method (Geo-VB-MILE); vbmile_1d / vbmile_2d
# inherit it and only override `dim` plus the architecture differences.
# Compatible with the released training convention: 6 angle inputs + 3 low-frequency
# channels, group norm, prior-bias initialisation supplied by the data (`gmm_prior.npz`).
_base_: ../base.yaml

exp_name: vbmile_model

model:
  _target_: vbmile_1d              # overridden to vbmile_2d by the 2-D config
  dim: 1
  seismic_channels: 6
  low_freq_channels: 3
  base_channels: 16
  norm_type: group
  num_experts: 3
  initial_temperature: 1.0
  final_temperature: 0.05
  # Leave these null to skip the GMM init (the buffers then hold a unit prior)
  prior_means: null
  prior_vars: null
  # 2-D expert-decoder FiLM settings (ignored by the 1-D branch)
  film_hidden_dim: 8
  film_kernel_size: 3
  modulation_scale: 1.0
  # Variational family: diag (default; 6-channel head, matches the released 1-D
  # checkpoint) or full (+3 off-diagonal channels per expert, Sigma = LL^T). Both
  # delivery configs use full. With a full-covariance GMM prior you MUST also set
  # model.prior_cov_shrinkage (0.05-0.1): the prior is near singular and the posterior
  variational_covariance: diag