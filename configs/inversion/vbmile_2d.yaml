# Main 2-D recipe: Geo-VB-MILE (dim=2), two-phase training.
#
# The 2-D network has a single structural form (merged 6-channel output head, skip2
# convolved before upsampling, a same-size tail, deterministic reflect padding); see
# src/models/vbmile/_film_decoder2d.py::ExpertDecoder2D. Only three things are left to
# the config:
#   * encoder geometry: `encoder_downsample: aniso` (per-axis downsampling);
#   * per-expert receptive field: `expert_dilations: [7, 15, 7]` (no parameter change);
#   * likelihood and schedule: full-covariance posterior, `deviatoric` seismic term at
#     weight 0.03, Gumbel temperature 2.0 -> 0.1, stage-1 lr 5e-4, 300 epochs in two
#     phases.
# The well term stays marginal + per-expert lambda (Eq. 21): the closed-form expert
# expectation measured no gain on this base.
# The data-side deterministic protocol (`num_workers: 0`, `explicit_generator: true`)
# lives in configs/data/seismic2d.yaml.
_base_:
  - ../base.yaml
  - ../data/seismic2d.yaml
  - ../model/vbmile_2d.yaml

exp_name: vbmile_2d

# Deterministic protocol (bit-wise reproducible): cudnn deterministic + strict mode
deterministic: true
deterministic_algorithms: true

model:
  encoder_downsample: aniso        # per-axis downsampling (skip2 keeps 6 columns at width 15)
  min_down_size: 3
  variational_covariance: full     # required: q(theta|z=k) = N(mu_k, Sigma_k)
  initial_temperature: 2.0         # Gumbel temperature 2.0 -> 0.1 (final: model config)
  prior_cov_shrinkage: 0.1         # covariance shrinkage, required with a full-covariance prior
  expert_dilations: [7, 15, 7]     # per-expert receptive field (no parameter change)

# The GMM parameter prior (normalized space) comes from data gmm_prior.npz and drives
# both the output-bias init and KL(theta); with a full posterior it must be paired
prior:
  _target_: gmm

forward:
  _target_: synthetic_seismic      # differentiable Aki-Richards + Ricker forward
  dim: 2
  angles_deg: [5, 10, 15, 20, 25, 30]
  wavelet:
    dt: 0.002
    f: 20.0
    length: 0.1

loss:
  _target_: vbelbo_2d
  seismic_obs_noise_init: 1.0
  well_obs_noise_init: 0.1
  clip_diff: 10.0
  kl_z_weight: 0.01          # overridden per phase by `phases`
  kl_theta_weight: 0.1
  expert_lambdas: [0.4831, 0.1668, 1.0]   # per-expert KL weight (lambda_k = I_k / max_i I_i)
  seismic_weight: 0.03       # weak constraint; 0.3 regresses, 0.03-0.1 is the plateau
  seismic_noise: deviatoric  # marginalise the trace common mode; constrain differences only
  seismic_white_noise_init: 0.4224

trainer:
  _target_: vbmile
  max_epochs: 300
  lr: 1.0e-2
  weight_decay: 1.0e-2
  warmup_epochs: 10
  warmup_start_lr: 1.0e-6
  lr_min: 1.0e-4
  grad_clip: 1.0
  batch_size: 2                       # 2-D slice batch (2 well-centred windows)
  shuffle_train: true
  # Two phases: joint training (gating + KL), then gating frozen for expert refinement.
  # The keys match src/trainers/vbmile_trainer.py::_apply_phase.
  # The stage-1 learning rate applies from the first epoch (the optimizer uses _phase_lr(0)).
  phases:
    - name: joint
      epochs: 50
      lr: 5.0e-4
      kl_z_weight: 0.01
      kl_theta_weight: 0.1
      freeze_gating: false
    - name: expert_refine
      epochs: 250
      lr: 1.0e-3
      kl_z_weight: 1.0e-3
      kl_theta_weight: 1.0e-3
      freeze_gating: true

# A non-full variational family fails the mandatory contract check (strict refuses)
theory_contract:
  require_full: true

metrics:
  - rmse
  - r2
  - pearson
  - mae
  - ssim